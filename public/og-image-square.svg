<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="squareBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="squareGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#squareBgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="200" r="100" fill="rgba(124, 58, 237, 0.2)" filter="url(#squareGlow)"/>
  <circle cx="1000" cy="1000" r="120" fill="rgba(139, 92, 246, 0.15)" filter="url(#squareGlow)"/>
  <circle cx="1000" cy="300" r="60" fill="rgba(30, 58, 138, 0.3)" filter="url(#squareGlow)"/>
  <circle cx="300" cy="900" r="80" fill="rgba(168, 85, 247, 0.25)" filter="url(#squareGlow)"/>
  
  <!-- Central logo/brand -->
  <text x="600" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="90" font-weight="800" text-anchor="middle" fill="white">
    TR
  </text>
  <text x="600" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,0.9)">
    Traceremove
  </text>
  <text x="600" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="rgba(255,255,255,0.7)">
    Research Lab
  </text>
  
  <!-- Tagline -->
  <text x="600" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="300" text-anchor="middle" fill="rgba(255,255,255,0.6)">
    AI Ethics &amp; Philosophy
  </text>
  
  <!-- URL -->
  <text x="600" y="950" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="rgba(124, 58, 237, 1)">
    traceremove.dev
  </text>
</svg>