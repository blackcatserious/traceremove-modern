<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="twitterBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="twitterGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#twitterBgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="120" r="50" fill="rgba(124, 58, 237, 0.3)" filter="url(#twitterGlow)"/>
  <circle cx="1050" cy="480" r="70" fill="rgba(139, 92, 246, 0.2)" filter="url(#twitterGlow)"/>
  <circle cx="950" cy="150" r="35" fill="rgba(30, 58, 138, 0.4)" filter="url(#twitterGlow)"/>
  
  <!-- Main content -->
  <text x="600" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" text-anchor="middle" fill="white">
    Traceremove Research
  </text>
  <text x="600" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="rgba(255,255,255,0.8)">
    AI Ethics &amp; Philosophy | Privacy-Preserving Technologies
  </text>
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="300" text-anchor="middle" fill="rgba(255,255,255,0.6)">
    Advanced research in responsible AI development
  </text>
  
  <!-- Bottom branding -->
  <text x="600" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="rgba(124, 58, 237, 1)">
    traceremove.dev
  </text>
</svg>