<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="60" fill="rgba(124, 58, 237, 0.2)" filter="url(#glow)"/>
  <circle cx="1100" cy="530" r="80" fill="rgba(139, 92, 246, 0.15)" filter="url(#glow)"/>
  <circle cx="900" cy="150" r="40" fill="rgba(30, 58, 138, 0.3)" filter="url(#glow)"/>
  
  <!-- Main content -->
  <text x="600" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="white">
    Traceremove Research
  </text>
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="rgba(255,255,255,0.8)">
    AI Ethics &amp; Philosophy Lab
  </text>
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="300" text-anchor="middle" fill="rgba(255,255,255,0.6)">
    Advanced AI research specializing in ethical AI systems,
  </text>
  <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="300" text-anchor="middle" fill="rgba(255,255,255,0.6)">
    privacy-preserving technologies, and philosophical foundations
  </text>
  
  <!-- Bottom branding -->
  <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="rgba(124, 58, 237, 1)">
    traceremove.dev
  </text>
</svg>