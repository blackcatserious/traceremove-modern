name: Comprehensive Platform Testing

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/

  accessibility-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Build and start server
        run: |
          npm run build
          npm start &
          sleep 10

      - name: Run accessibility tests
        run: |
          # Test key pages for accessibility
          axe http://localhost:3000 --save axe-report-home.json --verbose || true
          axe http://localhost:3000/about --save axe-report-about.json --verbose || true
          axe http://localhost:3000/research --save axe-report-research.json --verbose || true
          axe http://localhost:3000/tools --save axe-report-tools.json --verbose || true

      - name: Upload accessibility reports
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: axe-report-*.json

  link-check:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and start server for link checking
        run: |
          npm run build
          npm start &
          sleep 10

      - name: Run linkinator against local build
        run: |
          npx --yes linkinator http://localhost:3000 --recurse --format csv --skip "mailto:" --skip "tel:" | tee linkinator.csv
          echo "Link check completed"

      - name: Upload linkinator report
        uses: actions/upload-artifact@v4
        with:
          name: linkinator-report
          path: linkinator.csv

  performance-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Build and start server
        run: |
          npm run build
          npm start &
          sleep 10

      - name: Run Lighthouse CI
        run: |
          lhci autorun --collect.url=http://localhost:3000 --collect.url=http://localhost:3000/about --collect.url=http://localhost:3000/research --upload.target=temporary-public-storage || true

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
